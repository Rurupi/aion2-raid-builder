<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aion2 슈고와 아이들 Raid Builder</title><style>
:root{--bg:#080d16;--panel:#101827;--panel2:#151f32;--line:#2b3954;--text:#eef3ff;--muted:#91a0ba;--accent:#6f9cff;--tank:#62b5ff;--support:#70dfac;--dps:#d7a4ff;--danger:#ff7e8d;--main:#4f8cff;--potato:#8f3f5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#203760 0,#0a101b 43%,#060a11 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}.app{max-width:1500px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.brand h1{margin:0;font-size:29px;letter-spacing:.08em}.brand p{margin:7px 0 0;color:var(--muted)}button,input,select{font:inherit}button{border:1px solid var(--line);background:#17233a;color:#eef3ff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}button:hover{background:#213251}.primary{background:#315fae;border-color:#4e7ed0}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{background:rgba(15,23,38,.94);border:1px solid var(--line);border-radius:15px;box-shadow:0 15px 45px #0005}.sidebar{padding:15px}.panel-title{font-size:12px;letter-spacing:.12em;color:#b7c5df;font-weight:900;margin:0 0 11px}.addbox{padding:12px;border:1px solid #2b3954;border-radius:12px;background:#0d1524;margin-bottom:14px}.field{margin:8px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select,.role-select{width:100%;background:#111b2c;color:#eef3ff;border:1px solid #344563;border-radius:8px;padding:8px;outline:none}.row{display:grid;grid-template-columns:1fr 110px;gap:8px}.addbtn{width:100%;margin-top:6px}.member{padding:9px 10px;border:1px solid #31405d;border-radius:9px;background:#172238;margin:7px 0;cursor:grab;display:flex;align-items:center;justify-content:space-between;gap:8px}.member.tank{border-left:4px solid var(--tank)}.member.support{border-left:4px solid var(--support)}.member.dps{border-left:4px solid var(--dps)}.member small{color:var(--muted)}.member-actions{display:flex;align-items:center;gap:6px}.role-label{display:inline-flex;align-items:center;gap:5px}.role-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.role-dot.tank{background:var(--tank)}.role-dot.support{background:var(--support)}.role-dot.dps{background:var(--dps)}.type-badge{font-size:9px;font-weight:900;letter-spacing:.05em;border-radius:999px;padding:3px 6px;color:#fff}.type-badge.main{background:var(--main)}.type-badge.potato{background:var(--potato)}.x{border:0;background:transparent;color:#7586a3;padding:2px 4px;font-size:16px}.x:hover{background:transparent;color:var(--danger)}.sets{display:grid;gap:18px}.set{padding:15px}.set-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.set-actions{display:flex;gap:7px}.add-set{border-style:dashed}.delete-set{font-size:10px;padding:6px 9px;color:#ff9eaa}.set-name{font-size:18px;font-weight:900;letter-spacing:.08em}.set-desc{font-size:11px;color:var(--muted)}.parties{display:grid;grid-template-columns:1fr 1fr;gap:13px}.party{border:1px solid #2b3954;border-radius:12px;background:#0d1524;padding:11px}.party-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.party h3{font-size:14px;margin:0}.copyroles{font-size:10px;padding:5px 7px;color:#aebddd}.slot{min-height:55px;border:1px dashed #3a4b69;border-radius:9px;margin:7px 0;padding:6px;display:grid;grid-template-columns:104px 1fr;align-items:center;gap:7px;background:#111b2c}.slot.over{outline:2px solid #719cf0}.role-select{font-size:10px;font-weight:900;letter-spacing:.04em;padding:7px 5px}.role-select.tank{color:var(--tank)}.role-select.support{color:var(--support)}.role-select.dps{color:var(--dps)}.slot .member{margin:0;padding:7px 8px}.empty{color:#64738e;font-size:11px}.legend{display:flex;gap:11px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:11px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}.modal-backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9999}.modal-backdrop.show{display:flex}.modal{width:min(420px,calc(100% - 32px));background:#101827;border:1px solid #3b4b69;border-radius:14px;padding:20px;box-shadow:0 24px 80px #000a}.modal h3{margin:0 0 8px}.modal p{margin:0;color:var(--muted);line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.danger-btn{background:#8f3341;border-color:#bd5262}.danger-btn:hover{background:#aa3c4c}.footer{text-align:center;color:#6d7d98;font-size:11px;margin-top:14px}@media(max-width:950px){.layout{grid-template-columns:1fr}.parties{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><div class="top"><div class="brand"><h1>Aion2 슈고와 아이들 Raid Builder <small style="font-size:11px;color:#7285a5">v0.7</small></h1></div><div><button onclick="loadFromGoogle()">최신 공대 불러오기</button> <button onclick="clearPlacements()">배치 초기화</button> <button class="primary" onclick="autoBuild()">자동 세팅</button> <button class="primary" onclick="saveToGoogle()">공대 저장</button></div></div><div class="layout"><aside class="panel sidebar"><div class="panel-title">ADD MEMBER</div><div class="addbox"><div class="field"><label>유저 이름</label><input id="name" placeholder="예: 루루피"></div><div class="row"><div class="field"><label>직업</label><input id="className" placeholder="예: 검성"></div><div class="field"><label>역할</label><select id="role"><option value="tank">TANK</option><option value="support">SUPPORT</option><option value="dps" selected>DPS</option></select></div></div><div class="field"><label>Type</label><select id="memberType"><option value="main" selected>Main</option><option value="potato">Potato</option></select></div><button class="primary addbtn" onclick="addMember()">+ 공대원 추가</button></div><div class="panel-title">WAITING LIST <span id="count" style="float:right;color:#70819d"></span></div><div id="bench"></div><div class="legend"><span><i class="dot" style="background:var(--tank)"></i>TANK</span><span><i class="dot" style="background:var(--support)"></i>SUPPORT</span><span><i class="dot" style="background:var(--dps)"></i>DPS</span></div></aside><main class="sets" id="sets"></main></div><div class="footer"><span id="syncStatus">Google Sheet 연결 준비 중...</span><br>각 슬롯의 역할을 TANK / SUPPORT / DPS 중 직접 선택할 수 있습니다. 공대원은 드래그해서 배치하세요.</div></div><div id="deleteModal" class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><h3>공대원 삭제</h3><p id="deleteMessage"></p><div class="modal-actions"><button type="button" id="cancelDelete">취소</button><button type="button" id="confirmDelete" class="danger-btn">삭제</button></div></div></div><script>
const API_URL='https://script.google.com/macros/s/AKfycby-91rGDwGNf58FsebTTMAIwQag4MUUhvUNbd4LWRwqTV8L6RM3_cvQfxFWxsTTITbR4w/exec';
let members=[];
let placements={};
let dragId=null;
let nextId=1;
let pendingDeleteId=null;
const roles={tank:'TANK',support:'SUPPORT',dps:'DPS'};
let slotRoles={};
let sets=[{id:1,parties:[1,2]},{id:2,parties:[3,4]}];
let nextSetId=3;
let nextPartyId=5;

function defaultPartyRoles(p){['tank','support','dps','dps','dps'].forEach((r,i)=>{const k=`p${p}s${i}`;if(!slotRoles[k])slotRoles[k]=r})}
[1,2,3,4].forEach(defaultPartyRoles);

function apiRoleToLocal(r){r=String(r||'DPS').toLowerCase();return r==='tank'?'tank':r==='support'?'support':'dps'}
function apiTypeToLocal(t){return String(t||'Main').toLowerCase()==='potato'?'potato':'main'}
function setSyncStatus(t){const el=document.getElementById('syncStatus');if(el)el.textContent=t}

async function loadFromGoogle(){
  setSyncStatus('Google Sheet에서 불러오는 중...');
  try{
    const res=await fetch(API_URL+'?action=getData&ts='+Date.now(),{cache:'no-store'});
    const data=await res.json(); if(!data.success)throw new Error(data.error||'불러오기 실패');

    members=(data.members||[])
      .filter(x=>String(x.active||'YES').toUpperCase()!=='NO')
      .map((x,i)=>({id:i+1,n:String(x.name||''),c:String(x.className||''),r:apiRoleToLocal(x.role),t:apiTypeToLocal(x.type||x.memberType)}))
      .filter(x=>x.n);

    nextId=members.length?Math.max(...members.map(x=>x.id))+1:1;
    placements={};

    const raid=data.raid||[];
    const grouped={};
    raid.forEach(x=>{
      const p=+x.party, s=+x.slot-1;
      if(!p||s<0)return;
      const setId=+x.set||1;
      (grouped[setId]||(grouped[setId]=new Set())).add(p);
      const k=`p${p}s${s}`;
      slotRoles[k]=apiRoleToLocal(x.role);
      if(x.player){
        const m=members.find(mm=>mm.n===String(x.player));
        if(m)placements[k]=m.id;
      }
    });

    if(Object.keys(grouped).length){
      sets=Object.keys(grouped).map(Number).sort((a,b)=>a-b).map(id=>({id,parties:[...grouped[id]].sort((a,b)=>a-b)}));
      nextSetId=Math.max(...sets.map(s=>s.id))+1;
      const allParties=sets.flatMap(s=>s.parties);
      nextPartyId=allParties.length?Math.max(...allParties)+1:1;
    }
    sets.flatMap(s=>s.parties).forEach(defaultPartyRoles);
    buildShell();render();setSyncStatus('✓ Google Sheet 최신 데이터 불러옴');
  }catch(e){console.error(e);setSyncStatus('⚠ Google Sheet 불러오기 실패: '+e.message)}
}

async function saveToGoogle(){
  setSyncStatus('Google Sheet에 저장 중...');
  const memberData=members.map(m=>({name:m.n,className:m.c,role:roles[m.r],type:m.t==='potato'?'Potato':'Main',memberType:m.t==='potato'?'Potato':'Main',active:'YES'}));
  const raid=[];
  sets.forEach(set=>set.parties.forEach(p=>{
    for(let i=0;i<5;i++){
      const k=`p${p}s${i}`,m=members.find(x=>x.id===placements[k]);
      raid.push({set:set.id,party:p,slot:i+1,role:roles[slotRoles[k]||'dps'],player:m?m.n:'',className:m?m.c:'',type:m?(m.t==='potato'?'Potato':'Main'):''});
    }
  }));
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveAll',members:memberData,raid})});
    const data=await res.json();if(!data.success)throw new Error(data.error||'저장 실패');
    setSyncStatus('✓ Google Sheet 저장 완료 · '+new Date().toLocaleString());
  }catch(e){console.error(e);setSyncStatus('⚠ 저장 실패: '+e.message);alert('Google Sheet 저장에 실패했습니다.\n'+e.message)}
}

function memberHTML(m){
  const type=m.t==='potato'?'potato':'main';
  const typeText=type==='potato'?'POTATO':'MAIN';
  return `<div class="member ${m.r}" draggable="true" data-id="${m.id}">
    <div><b>${esc(m.n)}</b><br><small>${esc(m.c)}</small></div>
    <div class="member-actions">
      <small class="role-label"><i class="role-dot ${m.r}"></i>${roles[m.r]}</small>
      <span class="type-badge ${type}">${typeText}</span>
      <button type="button" class="x" draggable="false" data-remove-id="${m.id}" title="삭제">×</button>
    </div>
  </div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function roleOptions(key){return Object.entries(roles).map(([v,t])=>`<option value="${v}" ${slotRoles[key]===v?'selected':''}>${t}</option>`).join('')}

function buildShell(){
  const host=document.getElementById('sets');
  host.innerHTML=sets.map(set=>`<section class="panel set">
    <div class="set-head">
      <div><div class="set-name">SET ${set.id}</div><div class="set-desc">${set.parties.map(p=>'PARTY '+p).join(' + ')}</div></div>
      <div class="set-actions"><button class="delete-set" onclick="deleteSet(${set.id})">SET 삭제</button></div>
    </div>
    <div class="parties">${set.parties.map(p=>partyHTML(p)).join('')}</div>
  </section>`).join('') + `<button class="add-set" onclick="addSet()">+ Add Set</button>`;
}

function partyHTML(p){
  defaultPartyRoles(p);
  return `<div class="party"><div class="party-head"><h3>PARTY ${p}</h3><button class="copyroles" onclick="applyPartyRoles(${p})">이 구성 전체 적용</button></div>
    ${[0,1,2,3,4].map(i=>{let k=`p${p}s${i}`;return `<div class="slot" data-slot="${k}"><select class="role-select ${slotRoles[k]}" onchange="changeRole('${k}',this.value)">${roleOptions(k)}</select><div class="slot-content"></div></div>`}).join('')}
  </div>`;
}

function render(){
  const used=new Set(Object.values(placements));
  const waiting=members.filter(m=>!used.has(m.id));
  document.getElementById('count').textContent=`${waiting.length}명`;
  document.getElementById('bench').innerHTML=waiting.map(memberHTML).join('')||'<div class="empty">대기 인원 없음</div>';
  document.querySelectorAll('.slot').forEach(sl=>{
    let k=sl.dataset.slot,m=members.find(x=>x.id===placements[k]),sel=sl.querySelector('select');
    sel.className=`role-select ${slotRoles[k]}`;sel.value=slotRoles[k];
    sl.querySelector('.slot-content').innerHTML=m?memberHTML(m):'<span class="empty">Drop member here</span>';
  });
  bind();
}

function bind(){
  document.querySelectorAll('.x').forEach(btn=>{
    btn.onpointerdown=e=>e.stopPropagation();
    btn.onclick=e=>{e.preventDefault();e.stopPropagation();removeMember(+btn.dataset.removeId)};
  });
  document.querySelectorAll('.member').forEach(el=>el.addEventListener('dragstart',e=>{
    if(e.target.closest('.x')){e.preventDefault();return} dragId=+el.dataset.id;
  }));
  document.querySelectorAll('.slot').forEach(sl=>{
    sl.ondragover=e=>{e.preventDefault();sl.classList.add('over')};
    sl.ondragleave=()=>sl.classList.remove('over');
    sl.ondrop=e=>{
      e.preventDefault();sl.classList.remove('over');
      let m=members.find(x=>x.id===dragId),k=sl.dataset.slot;if(!m)return;
      if(m.r!==slotRoles[k]){alert(`${roles[slotRoles[k]]} 슬롯에는 ${roles[slotRoles[k]]} 역할의 공대원만 배치할 수 있습니다.`);return}
      Object.keys(placements).forEach(x=>{if(placements[x]===m.id)delete placements[x]});
      placements[k]=m.id;render();
    };
  });
}

function addMember(){
  let n=document.getElementById('name').value.trim(),
      c=document.getElementById('className').value.trim(),
      r=document.getElementById('role').value,
      t=document.getElementById('memberType').value;
  if(!n||!c){alert('유저 이름과 직업을 입력해 주세요.');return}
  members.push({id:nextId++,n,c,r,t});
  document.getElementById('name').value='';
  document.getElementById('className').value='';
  render();
}

function addSet(){
  const parties=[nextPartyId++,nextPartyId++];
  parties.forEach(defaultPartyRoles);
  sets.push({id:nextSetId++,parties});
  buildShell();render();
}

function deleteSet(id){
  const set=sets.find(s=>s.id===id);if(!set)return;
  const occupied=set.parties.some(p=>[0,1,2,3,4].some(i=>placements[`p${p}s${i}`]));
  const msg=occupied?`SET ${id} 안에 배치된 공대원이 있습니다. 삭제하면 모두 Waiting List로 이동합니다. 삭제하시겠습니까?`:`SET ${id}을 삭제하시겠습니까?`;
  if(!confirm(msg))return;
  set.parties.forEach(p=>[0,1,2,3,4].forEach(i=>{delete placements[`p${p}s${i}`];delete slotRoles[`p${p}s${i}`]}));
  sets=sets.filter(s=>s.id!==id);
  buildShell();render();
}

function removeMember(id){const m=members.find(x=>x.id===id);if(!m)return;pendingDeleteId=id;document.getElementById('deleteMessage').textContent=`정말 ${m.n} 공대원을 삭제하시겠습니까?`;document.getElementById('deleteModal').classList.add('show')}
function closeDeleteModal(){pendingDeleteId=null;document.getElementById('deleteModal').classList.remove('show')}
function confirmDeleteMember(){if(pendingDeleteId===null)return;const id=pendingDeleteId;members=members.filter(m=>m.id!==id);Object.keys(placements).forEach(k=>{if(placements[k]===id)delete placements[k]});closeDeleteModal();render()}
function changeRole(k,r){slotRoles[k]=r;if(placements[k]){let m=members.find(x=>x.id===placements[k]);if(m&&m.r!==r)delete placements[k]}render()}
function applyPartyRoles(p){let src=[0,1,2,3,4].map(i=>slotRoles[`p${p}s${i}`]);sets.flatMap(s=>s.parties).forEach(party=>src.forEach((r,i)=>{let k=`p${party}s${i}`;slotRoles[k]=r;if(placements[k]){let m=members.find(x=>x.id===placements[k]);if(m&&m.r!==r)delete placements[k]}}));buildShell();render()}
function autoBuild(){placements={};let pools={tank:members.filter(x=>x.r==='tank'),support:members.filter(x=>x.r==='support'),dps:members.filter(x=>x.r==='dps')};let idx={tank:0,support:0,dps:0};sets.flatMap(s=>s.parties).forEach(p=>{for(let i=0;i<5;i++){let k=`p${p}s${i}`,r=slotRoles[k],m=pools[r][idx[r]++];if(m)placements[k]=m.id}});render()}
function clearPlacements(){placements={};render()}

document.getElementById('cancelDelete').onclick=closeDeleteModal;
document.getElementById('confirmDelete').onclick=confirmDeleteMember;
document.getElementById('deleteModal').onclick=e=>{if(e.target.id==='deleteModal')closeDeleteModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDeleteModal();if(e.key==='Enter'&&(document.activeElement.id==='name'||document.activeElement.id==='className'))addMember()});
buildShell();render();loadFromGoogle();
</script></body></html>
